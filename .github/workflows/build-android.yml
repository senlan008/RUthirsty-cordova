name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Cordova
      run: npm install -g cordova

    - name: Install project dependencies
      working-directory: ./ruthirsty
      run: npm install

    - name: Add Android platform
      working-directory: ./ruthirsty
      run: cordova platform add android || true

    - name: Build debug APK
      working-directory: ./ruthirsty
      run: cordova build android --debug

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: ruthirsty/platforms/android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Build release APK
      working-directory: ./ruthirsty
      run: cordova build android --release

    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-unsigned
        path: ruthirsty/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
        retention-days: 30
